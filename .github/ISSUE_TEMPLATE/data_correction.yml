name: Data correction
description: Report incorrect program or hackathon information with a reliable source
body:
  - type: markdown
    attributes:
      value: |
        Data corrections are especially valuable. Please provide a primary
        source that confirms the correct information. Do not include secrets
        or private information.

  - type: textarea
    id: incorrect-value
    attributes:
      label: What is incorrect?
      description: Identify the current value and explain why it is wrong.
      placeholder: The displayed application deadline is incorrect.
    validations:
      required: true

  - type: textarea
    id: correct-value
    attributes:
      label: What should the correct value be?
      description: Provide the corrected value and relevant context.
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Where does it appear on cyrus.ai?
      description: Link to the page displaying the incorrect information.
      placeholder: https://cyrus-agent.vercel.app/issues
    validations:
      required: true

  - type: input
    id: primary-source
    attributes:
      label: Primary source
      description: Link to an official program, organizer, or event source.
      placeholder: https://official-organizer.example/program
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add details that help verify the correction.

  - type: checkboxes
    id: policy
    attributes:
      label: Before you start work
      options:
        - label: I have read CONTRIBUTING.md and will not write code until a maintainer assigns this issue to me
          required: true
